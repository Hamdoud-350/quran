name: quran_audio_app
description: Holy Quran Audio Streaming & Offline — Material 3, background playback, ambient mixer.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management (Clean Architecture + Riverpod)
  flutter_riverpod: ^2.5.4
  equatable: ^2.0.7
  rxdart: ^0.27.7

  # Audio — background service + streaming
  just_audio: ^0.9.42
  audio_service: ^0.18.15
  audio_session: ^0.1.21
  just_audio_background: ^0.0.1-beta.11

  # Network / storage / utils
  dio: ^5.7.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.4
  path: ^1.9.0
  permission_handler: ^11.3.1
  shared_preferences: ^2.3.2
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.11

flutter:
  uses-material-design: true
  assets:
    - assets/audio/ambient/
